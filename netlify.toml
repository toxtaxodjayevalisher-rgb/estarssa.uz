[build]
  publish = "public"

[[redirects]]
  from = "/starssa"
  to = "/starssa/index.html"
  status = 200

[[redirects]]
  from = "/starssa/*"
  to = "/starssa/:splat.html"
  status = 200

[[redirects]]
  from = "/ustoz"
  to = "/ustoz/index.html"
  status = 200

[[redirects]]
  from = "/ustoz/*"
  to = "/ustoz/:splat.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

