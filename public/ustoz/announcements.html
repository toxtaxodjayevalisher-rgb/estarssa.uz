<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E'lonlar — E-STARSSA (Ustoz)</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="layoutContainer" class="min-h-[100dvh] flex flex-col md:flex-row">
    
    <main class="flex-1 flex flex-col min-w-0 pb-20 md:pb-6 overflow-y-auto">
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">E'lonlar va Yangiliklar</h1>
          <p class="text-xs sm:text-sm text-slate-500">Muhim yangiliklarni Telegram guruhiga tarqatish</p>
        </div>
        <button onclick="toggleForm()" id="toggleFormBtn" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-emerald-500/20 transition-all flex items-center gap-1.5">
          <span>+</span>
          <span>Yangi E'lon</span>
        </button>
      </header>

      <div class="p-4 sm:p-8 space-y-6 max-w-4xl w-full mx-auto">
        <div id="announcementFormCard" class="hidden bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900 pb-2 border-b border-slate-100 flex items-center gap-2">
            <span>📢</span> Yangi e'lon yozish
          </h2>
          <form id="annForm" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E'lon Sarlavhasi *</label>
              <input id="annTitle" required placeholder="Masalan: Ertaga ota-onalar majlisi" class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E'lon Matni *</label>
              <textarea id="annContent" required rows="4" placeholder="Batafsil ma'lumotni yozing..." class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-emerald-600"></textarea>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Rasm biriktirish (ixtiyoriy)</label>
              <input id="annImage" type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
            </div>
            <div class="flex items-center justify-end gap-2 pt-2">
              <button type="button" onclick="toggleForm()" class="px-4 py-2.5 rounded-xl text-slate-600 font-bold text-xs">Bekor qilish</button>
              <button type="submit" id="annSubmitBtn" class="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-md shadow-emerald-500/20">Telegramga chiqarish</button>
            </div>
          </form>
        </div>

        <div id="announcementsList" class="space-y-4">
          <p class="text-sm text-slate-400">E'lonlar yuklanmoqda...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function init() {
      const user = await EStarssa.requireAuth(['USTOZ', 'ADMIN']);
      if (!user) return;
      EStarssa.renderLayout('/ustoz/announcements', user.role, user);

      loadAnnouncements();
    }

    function toggleForm() {
      const card = document.getElementById('announcementFormCard');
      const btn = document.getElementById('toggleFormBtn');
      card.classList.toggle('hidden');
      btn.textContent = card.classList.contains('hidden') ? "+ Yangi E'lon" : "Yopish";
    }

    async function loadAnnouncements() {
      try {
        const res = await fetch('/api/announcements');
        const data = await res.json();
        const list = document.getElementById('announcementsList');

        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = `<p class="p-8 text-center text-sm text-slate-400">Hozircha e'lonlar mavjud emas.</p>`;
          return;
        }

        list.innerHTML = data.map(a => {
          const d = new Date(a.created_at).toLocaleString('uz-UZ');
          return `
            <div class="p-5 sm:p-6 rounded-3xl bg-white border border-slate-200 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-base sm:text-lg text-slate-900">${a.title}</h3>
                  <p class="text-xs text-slate-400">${d}</p>
                </div>
                <button onclick="deleteAnn('${a.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-bold p-1">O'chirish</button>
              </div>
              <p class="text-sm text-slate-700 whitespace-pre-wrap">${a.content}</p>
              ${a.image_url ? `<img src="${a.image_url}" class="rounded-2xl max-h-72 object-cover border border-slate-100" />` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('annForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('annSubmitBtn');
      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      const formData = new FormData();
      formData.append('title', document.getElementById('annTitle').value.trim());
      formData.append('content', document.getElementById('annContent').value.trim());
      const img = document.getElementById('annImage').files[0];
      if (img) formData.append('image', img);

      try {
        const res = await fetch('/api/announcements', { method: 'POST', body: formData });
        if (res.ok) {
          document.getElementById('annTitle').value = '';
          document.getElementById('annContent').value = '';
          document.getElementById('annImage').value = '';
          toggleForm();
          loadAnnouncements();
        } else {
          alert('Xatolik yuz berdi');
        }
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Telegramga chiqarish";
      }
    });

    async function deleteAnn(id) {
      if (!confirm('Haqiqatan ham ushbu e`lonni o`chirmoqchimisiz?')) return;
      try {
        const res = await fetch(`/api/announcements/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadAnnouncements();
        }
      } catch (e) {
        alert(e.message);
      }
    }

    init();
  </script>
</body>
</html>
