<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'quvchilar — E-STARSSA</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="layoutContainer" class="min-h-[100dvh] flex flex-col md:flex-row">
    
    <main class="flex-1 flex flex-col min-w-0 pb-20 md:pb-6 overflow-y-auto">
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">O'quvchilar Ro'yxati</h1>
          <p class="text-xs sm:text-sm text-slate-500">Guruh tarkibi va Telegram aloqasi</p>
        </div>
        <button onclick="openAddStudentModal()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-blue-500/20 transition-all flex items-center gap-1.5">
          <span>+</span>
          <span>O'quvchi qo'shish</span>
        </button>
      </header>

      <div class="p-4 sm:p-8 space-y-6 max-w-5xl w-full mx-auto">
        
        <!-- Search & Filter bar -->
        <div class="flex items-center gap-3">
          <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">🔍</span>
            <input id="searchInput" oninput="filterStudents()" placeholder="Ism yoki telefon bo'yicha qidirish..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm outline-none focus:ring-2 focus:ring-blue-600 transition" />
          </div>
          <span id="studentsCountBadge" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-600 whitespace-nowrap">
            Jami: 0 ta
          </span>
        </div>

        <!-- Students List -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div id="studentsList" class="divide-y divide-slate-100">
            <p class="p-8 text-center text-sm text-slate-400">O'quvchilar yuklanmoqda...</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Telegram Message Modal -->
  <div id="msgModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 class="font-bold text-slate-900 text-base sm:text-lg flex items-center gap-1.5">
            <span>✈️</span> Telegram orqali yozish
          </h3>
          <p id="msgModalStudentName" class="text-xs text-blue-600 font-bold mt-0.5"></p>
        </div>
        <button onclick="closeMsgModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Xabar yo'nalishi</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="targetDirectBtn" onclick="setMsgTarget('direct')" class="py-2 px-3 rounded-xl border text-xs font-bold text-center bg-blue-50 text-blue-700 border-blue-200">
              👤 Shaxsiy lichkasi
            </button>
            <button id="targetGroupBtn" onclick="setMsgTarget('group')" class="py-2 px-3 rounded-xl border text-xs font-bold text-center bg-white text-slate-600 border-slate-200">
              👥 Guruhda eslatma
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Xabar matni</label>
          <textarea id="msgTextArea" rows="3" placeholder="O'quvchiga yuboriladigan xabarni yozing..." class="w-full p-3 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-blue-600"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeMsgModal()" class="px-4 py-2 rounded-xl text-slate-600 font-bold text-xs hover:bg-slate-100">Bekor qilish</button>
        <button id="sendMsgBtn" onclick="sendTelegramMessage()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-md shadow-blue-500/20">Yuborish</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Student Modal -->
  <div id="studentFormModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="formModalTitle" class="font-bold text-slate-900 text-base sm:text-lg">Yangi o'quvchi qo'shish</h3>
        <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>
      <form id="studentForm" class="space-y-3">
        <input type="hidden" id="studentId" />
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">F.I.SH *</label>
          <input id="studentFullName" required placeholder="Familiya Ism Sharif" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Guruh nomi *</label>
          <input id="studentGroupName" required placeholder="Masalan: IG2-26" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Telefon raqam</label>
          <input id="studentPhone" placeholder="+998901234567" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tug'ilgan sana</label>
          <input id="studentBirthDate" type="date" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div class="flex items-center justify-end gap-2 pt-3">
          <button type="button" onclick="closeStudentModal()" class="px-4 py-2 rounded-xl text-slate-600 font-bold text-xs">Bekor qilish</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-md shadow-blue-500/20">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allStudents = [];
    let currentSelectedStudent = null;
    let currentMsgTarget = 'direct';

    async function init() {
      const user = await EStarssa.requireAuth(['STARSSA', 'ADMIN']);
      if (!user) return;
      EStarssa.renderLayout('/starssa/students', user.role, user);

      loadStudents();
    }

    async function loadStudents() {
      try {
        const res = await fetch('/api/students');
        const data = await res.json();
        if (Array.isArray(data)) {
          allStudents = data;
          document.getElementById('studentsCountBadge').textContent = `Jami: ${allStudents.length} ta`;
          filterStudents();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function filterStudents() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allStudents.filter(s => 
        s.full_name.toLowerCase().includes(q) || 
        (s.phone && s.phone.includes(q))
      );

      const list = document.getElementById('studentsList');
      if (filtered.length === 0) {
        list.innerHTML = `<p class="p-8 text-center text-sm text-slate-400">Hech qanday o'quvchi topilmadi.</p>`;
        return;
      }

      list.innerHTML = filtered.map((s, idx) => `
        <div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/70 transition">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold text-xs flex items-center justify-center flex-shrink-0">
              ${idx + 1}
            </span>
            <div>
              <p class="font-bold text-slate-900 text-sm sm:text-base">${s.full_name}</p>
              <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
                <span>👥 ${s.group_name}</span>
                <span>•</span>
                <span>📞 ${s.phone || 'Telefon yo`q'}</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="openMsgModal('${s.id}')" class="px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-xs border border-blue-200 transition flex items-center gap-1.5">
              <span>✈️</span>
              <span>Telegramga yozish</span>
            </button>
            <button onclick="openEditStudentModal('${s.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
              Tahrirlash
            </button>
          </div>
        </div>
      `).join('');
    }

    function openMsgModal(id) {
      currentSelectedStudent = allStudents.find(s => s.id === id);
      if (!currentSelectedStudent) return;
      document.getElementById('msgModalStudentName').textContent = currentSelectedStudent.full_name;
      document.getElementById('msgTextArea').value = '';
      setMsgTarget('direct');
      document.getElementById('msgModal').classList.remove('hidden');
    }

    function closeMsgModal() {
      document.getElementById('msgModal').classList.add('hidden');
    }

    function setMsgTarget(target) {
      currentMsgTarget = target;
      const directBtn = document.getElementById('targetDirectBtn');
      const groupBtn = document.getElementById('targetGroupBtn');
      if (target === 'direct') {
        directBtn.className = "py-2 px-3 rounded-xl border text-xs font-bold text-center bg-blue-50 text-blue-700 border-blue-200";
        groupBtn.className = "py-2 px-3 rounded-xl border text-xs font-bold text-center bg-white text-slate-600 border-slate-200";
      } else {
        groupBtn.className = "py-2 px-3 rounded-xl border text-xs font-bold text-center bg-blue-50 text-blue-700 border-blue-200";
        directBtn.className = "py-2 px-3 rounded-xl border text-xs font-bold text-center bg-white text-slate-600 border-slate-200";
      }
    }

    async function sendTelegramMessage() {
      const text = document.getElementById('msgTextArea').value.trim();
      if (!text || !currentSelectedStudent) return alert('Xabar matnini kiriting');

      const btn = document.getElementById('sendMsgBtn');
      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      try {
        const res = await fetch('/api/starssa/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_id: currentSelectedStudent.id,
            message: text,
            target: currentMsgTarget
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          alert(`✅ Xabar muvaffaqiyatli ${data.sent_to} yuborildi!`);
          closeMsgModal();
        } else {
          alert('Xatolik: ' + (data.error || 'Noma`lum'));
        }
      } catch (err) {
        alert('Tarmoq xatosi: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Yuborish";
      }
    }

    function openAddStudentModal() {
      document.getElementById('formModalTitle').textContent = "Yangi o'quvchi qo'shish";
      document.getElementById('studentId').value = '';
      document.getElementById('studentFullName').value = '';
      document.getElementById('studentGroupName').value = allStudents[0]?.group_name || 'IG2-26';
      document.getElementById('studentPhone').value = '';
      document.getElementById('studentBirthDate').value = '';
      document.getElementById('studentFormModal').classList.remove('hidden');
    }

    function openEditStudentModal(id) {
      const s = allStudents.find(x => x.id === id);
      if (!s) return;
      document.getElementById('formModalTitle').textContent = "O'quvchini tahrirlash";
      document.getElementById('studentId').value = s.id;
      document.getElementById('studentFullName').value = s.full_name;
      document.getElementById('studentGroupName').value = s.group_name;
      document.getElementById('studentPhone').value = s.phone || '';
      document.getElementById('studentBirthDate').value = s.birth_date ? s.birth_date.split('T')[0] : '';
      document.getElementById('studentFormModal').classList.remove('hidden');
    }

    function closeStudentModal() {
      document.getElementById('studentFormModal').classList.add('hidden');
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('studentId').value;
      const full_name = document.getElementById('studentFullName').value.trim();
      const group_name = document.getElementById('studentGroupName').value.trim();
      const phone = document.getElementById('studentPhone').value.trim();
      const birth_date = document.getElementById('studentBirthDate').value;

      const method = id ? 'PUT' : 'POST';
      try {
        const res = await fetch('/api/students', {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, full_name, group_name, phone, birth_date })
        });
        if (res.ok) {
          closeStudentModal();
          loadStudents();
        } else {
          alert('Xatolik yuz berdi');
        }
      } catch (err) {
        alert(err.message);
      }
    });

    init();
  </script>
</body>
</html>
