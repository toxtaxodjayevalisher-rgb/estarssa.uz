<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reyting & Sertifikat — E-STARSSA (Admin)</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="layoutContainer" class="min-h-[100dvh] flex flex-col md:flex-row">
    
    <main class="flex-1 flex flex-col min-w-0 pb-20 md:pb-6 overflow-y-auto">
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Guruhlar Reytingi & Sertifikatlar</h1>
          <p class="text-xs sm:text-sm text-slate-500">Davomat ko'rsatkichi bo'yicha guruhlar reytingi</p>
        </div>
      </header>

      <div class="p-4 sm:p-8 space-y-6 max-w-4xl w-full mx-auto">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-4">
          <h2 class="text-lg font-bold text-slate-900 pb-2 border-b border-slate-100 flex items-center gap-2">
            <span>🏆</span> Eng namunali guruhlar (Oxirgi 7 kun)
          </h2>

          <div id="ratingsList" class="space-y-3">
            <p class="text-sm text-slate-400">Reyting hisoblanmoqda...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function init() {
      const user = await EStarssa.requireAuth(['ADMIN']);
      if (!user) return;
      EStarssa.renderLayout('/admin/ratings', user.role, user);

      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        const list = document.getElementById('ratingsList');

        if (!data.groupRankings || data.groupRankings.length === 0) {
          list.innerHTML = `<p class="p-6 text-center text-sm text-slate-400">Hozircha reyting ma'lumotlari mavjud emas.</p>`;
          return;
        }

        const medals = ['🥇', '🥈', '🥉'];
        list.innerHTML = data.groupRankings.map((g, idx) => `
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${medals[idx] || '🎖️'}</span>
              <div>
                <p class="font-bold text-slate-900 text-sm sm:text-base">${g.name} guruhi</p>
                <p class="text-xs text-slate-400">O'rin: ${idx + 1}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="px-3 py-1.5 rounded-full text-xs font-black ${g.percentage >= 90 ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">
                ${g.percentage}% Davomat
              </span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
