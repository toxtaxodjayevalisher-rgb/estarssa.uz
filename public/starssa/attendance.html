<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Davomat Qilish — E-STARSSA</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="layoutContainer" class="min-h-[100dvh] flex flex-col md:flex-row">
    
    <main class="flex-1 flex flex-col min-w-0 pb-24 md:pb-6 overflow-y-auto">
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Bugungi Davomat</h1>
          <p id="groupHeaderSubtitle" class="text-xs sm:text-sm text-slate-500">O'quvchilar yo'qlamasi</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="markAllPresent()" class="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-xs border border-emerald-200 transition-all flex items-center gap-1.5">
            <span>✓</span>
            <span class="hidden sm:inline">Barchasini KELDI qilish</span>
          </button>
        </div>
      </header>

      <div class="p-4 sm:p-8 space-y-6 max-w-5xl w-full mx-auto">
        
        <div id="sessionStatusAlert" class="hidden p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-sm flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span>⏳</span>
            <span id="sessionStatusText" class="font-bold">Bugungi davomat allaqachon tasdiqlash uchun yuborilgan.</span>
          </div>
          <button onclick="revertDraft()" class="px-3 py-1 rounded-xl bg-amber-200 hover:bg-amber-300 font-bold text-xs">
            Qayta tahrirlash
          </button>
        </div>

        <!-- Students List Table / Cards -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 sm:p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">O'quvchi (F.I.SH)</span>
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Holati</span>
          </div>

          <div id="studentsList" class="divide-y divide-slate-100">
            <p class="p-8 text-center text-sm text-slate-400">O'quvchilar ro'yxati yuklanmoqda...</p>
          </div>
        </div>

        <!-- Action Bar -->
        <div class="fixed bottom-14 md:bottom-6 left-0 right-0 md:left-64 z-30 px-4 sm:px-8">
          <div class="max-w-4xl mx-auto bg-slate-900/90 backdrop-blur-md p-3.5 sm:p-4 rounded-2xl shadow-2xl flex items-center justify-between text-white border border-slate-700">
            <div class="text-xs sm:text-sm">
              <span class="text-slate-400">Jami o'quvchilar:</span>
              <span id="totalStudentsCount" class="font-bold text-white ml-1">0</span>
            </div>
            <button id="submitBtn" onclick="submitAttendance(true)" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs sm:text-sm shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
              <span>🚀</span>
              <span>Ustozga yuborish</span>
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    let students = [];
    let attendance = {};
    let groupName = 'IG2-26';
    let currentSessionId = null;

    async function init() {
      const user = await EStarssa.requireAuth(['STARSSA', 'ADMIN']);
      if (!user) return;
      EStarssa.renderLayout('/starssa/attendance', user.role, user);

      loadData();
    }

    async function loadData() {
      try {
        const [studentsRes, statsRes] = await Promise.all([
          fetch('/api/students'),
          fetch('/api/attendance/stats')
        ]);
        const studentsData = await studentsRes.json();
        const statsData = await statsRes.json();

        if (Array.isArray(studentsData)) {
          students = studentsData;
          document.getElementById('totalStudentsCount').textContent = students.length;
          if (students.length > 0 && students[0].group_name) {
            groupName = students[0].group_name;
            document.getElementById('groupHeaderSubtitle').textContent = groupName + " guruhi davomati";
          }

          students.forEach(s => {
            attendance[s.id] = { status: 'KELDI', note: '' };
          });

          if (statsData && statsData.records && statsData.records.length > 0) {
            statsData.records.forEach(r => {
              attendance[r.student_id] = { status: r.status, note: r.note || '' };
            });
          }

          if (statsData?.status && statsData.status !== 'Boshlanmagan') {
            currentSessionId = statsData.session_id;
            const alertBox = document.getElementById('sessionStatusAlert');
            const alertText = document.getElementById('sessionStatusText');
            alertBox.classList.remove('hidden');
            if (statsData.status === 'APPROVED') {
              alertText.textContent = "Bugungi davomat ustoz tomonidan tasdiqlangan.";
            } else if (statsData.status === 'SENT_FOR_APPROVAL') {
              alertText.textContent = "Bugungi davomat ustoz tasdiqlashini kutmoqda.";
            }
          }

          renderStudents();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderStudents() {
      const list = document.getElementById('studentsList');
      if (students.length === 0) {
        list.innerHTML = `<p class="p-8 text-center text-sm text-slate-400">Ushbu guruhda o'quvchilar topilmadi.</p>`;
        return;
      }

      list.innerHTML = students.map((s, idx) => {
        const current = attendance[s.id] || { status: 'KELDI', note: '' };
        return `
          <div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/70 transition-colors">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 font-bold text-xs flex items-center justify-center flex-shrink-0">
                ${idx + 1}
              </span>
              <div>
                <p class="font-bold text-slate-800 text-sm sm:text-base">${s.full_name}</p>
                <p class="text-xs text-slate-400">${s.phone || 'Telefon kiritilmagan'}</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
              <button onclick="setStatus('${s.id}', 'KELDI')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${current.status === 'KELDI' ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                Keldi
              </button>
              <button onclick="setStatus('${s.id}', 'KECHIKIB_KELDI')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${current.status === 'KECHIKIB_KELDI' ? 'bg-amber-500 text-white border-amber-500 shadow-md shadow-amber-500/20' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                Kechikdi
              </button>
              <button onclick="setStatus('${s.id}', 'UZR_LI')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${current.status === 'UZR_LI' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                Sababli
              </button>
              <button onclick="setStatus('${s.id}', 'KELMADI')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${current.status === 'KELMADI' ? 'bg-rose-600 text-white border-rose-600 shadow-md shadow-rose-500/20' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                Kelmadi
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setStatus(id, status) {
      if (!attendance[id]) attendance[id] = { status: 'KELDI', note: '' };
      attendance[id].status = status;
      renderStudents();
    }

    function markAllPresent() {
      students.forEach(s => {
        attendance[s.id] = { status: 'KELDI', note: '' };
      });
      renderStudents();
    }

    async function submitAttendance(submit) {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      const records = Object.entries(attendance).map(([student_id, data]) => ({
        student_id,
        status: data.status,
        note: data.status === 'KELMADI' ? 'sababsiz' : data.status === 'UZR_LI' ? 'kasal' : data.status === 'KECHIKIB_KELDI' ? 'kechikdi' : null
      }));

      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: new Date().toISOString(),
            group_name: groupName,
            records,
            submit
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert('✅ Davomat muvaffaqiyatli saqlandi va Telegram guruhiga yetkazildi!');
          window.location.href = '/starssa/index.html';
        } else {
          alert('Xatolik: ' + (data.error || 'Noma`lum'));
          btn.disabled = false;
          btn.textContent = "Ustozga yuborish";
        }
      } catch (err) {
        alert('Server xatosi: ' + err.message);
        btn.disabled = false;
        btn.textContent = "Ustozga yuborish";
      }
    }

    async function revertDraft() {
      if (!currentSessionId) return;
      if (!confirm('Davomatni bekor qilib, qaytadan tahrirlaysizmi?')) return;
      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'edit_draft', session_id: currentSessionId })
        });
        if (res.ok) {
          window.location.reload();
        }
      } catch (e) {
        alert(e.message);
      }
    }

    init();
  </script>
</body>
</html>
