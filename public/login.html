<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizimga kirish — E-STARSSA</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-center bg-gradient-to-br from-[#070c1e] via-[#0a1128] to-[#0d1838] p-4 sm:p-6 text-slate-100 antialiased font-sans relative overflow-hidden">
  
  <!-- Ambient background glow -->
  <div class="absolute top-1/4 -left-20 w-72 h-72 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 -right-20 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-6 sm:mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 shadow-xl shadow-blue-500/25 mb-3">
        <span class="text-2xl">⭐</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-serif font-black tracking-wider text-white">
        E-STARSSA
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mt-1.5 font-medium">
        Maktab Sardorlari va Ustozlar boshqaruv portali
      </p>
    </div>

    <!-- Login Form Card -->
    <div class="bg-white text-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-100">
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-1">
        Tizimga kirish
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 mb-5">
        O'z login va parolingizni kiriting
      </p>

      <div id="errorAlert" class="hidden mb-4 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs sm:text-sm flex items-center gap-2">
        <span class="text-base flex-shrink-0">⚠️</span>
        <span id="errorMessage" class="font-medium leading-tight"></span>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            Login
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              👤
            </span>
            <input 
              id="usernameInput"
              type="text" 
              required
              placeholder="Loginni kiriting"
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            Parol
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              🔒
            </span>
            <input 
              id="passwordInput"
              type="password" 
              required
              placeholder="Parolni kiriting"
              class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all"
            />
            <button 
              type="button"
              id="togglePasswordBtn"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
            >
              👁️
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2 mt-2"
        >
          <span>Kirish</span>
          <span>→</span>
        </button>
      </form>
    </div>

    <!-- Footer info -->
    <div class="text-center mt-6 text-xs text-slate-500">
      <p>© 2026 E-STARSSA Platformasi. Barcha huquqlar himoyalangan.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Tekshirilmoqda...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value
          })
        });

        const data = await res.json();
        if (!res.ok) {
          errorMessage.textContent = data.error || "Login yoki parol noto'g'ri";
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Kirish</span><span>→</span>';
        } else {
          submitBtn.innerHTML = '<span>Kirilmoqda...</span>';
          window.location.href = '/' + data.role.toLowerCase() + '/index.html';
        }
      } catch (err) {
        errorMessage.textContent = "Server bilan bog'lanishda xatolik yuz berdi";
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Kirish</span><span>→</span>';
      }
    });
  </script>
</body>
</html>
