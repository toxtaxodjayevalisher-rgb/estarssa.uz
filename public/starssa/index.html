<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starssa Kabineti — E-STARSSA</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="layoutContainer" class="min-h-[100dvh] flex flex-col md:flex-row">
    
    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 pb-20 md:pb-6 overflow-y-auto">
      
      <!-- Top Bar -->
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Starssa Boshqaruv Paneli</h1>
          <p id="topSubtitle" class="text-xs sm:text-sm text-slate-500">Guruh davomati va o'quv intizomi monitoringi</p>
        </div>
        <div class="flex items-center gap-2">
          <a href="/starssa/attendance.html" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-blue-500/20 transition-all">
            <span>📋</span>
            <span>Davomat qilish</span>
          </a>
        </div>
      </header>

      <div class="p-4 sm:p-8 space-y-6 max-w-6xl w-full mx-auto">
        
        <!-- Birthday Banner -->
        <div id="birthdayContainer" class="hidden"></div>

        <!-- Today Attendance Status Card -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
            <div>
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Bugungi holat</span>
              <h2 class="text-lg sm:text-xl font-bold text-slate-900 mt-0.5">Bugungi Davomat</h2>
            </div>
            <div id="attendanceStatusBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">
              Yuklanmoqda...
            </div>
          </div>

          <!-- Stats Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mt-6">
            <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-100">
              <span class="text-xs font-bold text-emerald-600 uppercase">Keldi</span>
              <p id="countKeldi" class="text-2xl sm:text-3xl font-black text-emerald-700 mt-1">0</p>
            </div>
            <div class="p-4 rounded-2xl bg-amber-50 border border-amber-100">
              <span class="text-xs font-bold text-amber-600 uppercase">Kechikdi</span>
              <p id="countKechikdi" class="text-2xl sm:text-3xl font-black text-amber-700 mt-1">0</p>
            </div>
            <div class="p-4 rounded-2xl bg-blue-50 border border-blue-100">
              <span class="text-xs font-bold text-blue-600 uppercase">Sababli</span>
              <p id="countSababli" class="text-2xl sm:text-3xl font-black text-blue-700 mt-1">0</p>
            </div>
            <div class="p-4 rounded-2xl bg-rose-50 border border-rose-100">
              <span class="text-xs font-bold text-rose-600 uppercase">Kelmadi</span>
              <p id="countKelmadi" class="text-2xl sm:text-3xl font-black text-rose-700 mt-1">0</p>
            </div>
          </div>

          <div id="revertActionBox" class="mt-6 pt-6 border-t border-slate-100 hidden">
            <button onclick="handleRevertAttendance()" class="px-4 py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold text-xs sm:text-sm border border-amber-200 transition-all flex items-center gap-2">
              <span>⚠️</span>
              <span>Bugungi davomatni bekor qilib, qaytadan qilish</span>
            </button>
          </div>
        </div>

        <!-- 30 Days Top Violators -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-lg font-bold text-slate-900">Eng ko'p dars qoldirganlar (30 kun)</h2>
              <p class="text-xs text-slate-400">Intizom monitoringi va qoidabuzarliklar</p>
            </div>
          </div>
          <div id="violatorsList" class="space-y-3">
            <p class="text-sm text-slate-400">Yuklanmoqda...</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    let currentStats = null;

    async function init() {
      const user = await EStarssa.requireAuth(['STARSSA', 'ADMIN']);
      if (!user) return;
      EStarssa.renderLayout('/starssa', user.role, user);

      // Load birthdays
      loadBirthdays();

      // Load stats
      loadStats();

      // Load violators
      loadViolators();
    }

    async function loadBirthdays() {
      try {
        const res = await fetch('/api/birthdays/today');
        const data = await res.json();
        if (data.birthdays && data.birthdays.length > 0) {
          const container = document.getElementById('birthdayContainer');
          container.className = "p-4 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-lg flex items-center gap-3";
          container.innerHTML = `
            <span class="text-3xl">🎉</span>
            <div>
              <h3 class="font-bold text-sm sm:text-base">Bugun tavallud ayyom!</h3>
              <p class="text-xs sm:text-sm text-pink-100">${data.birthdays.map(b => b.text).join(' | ')}</p>
            </div>
          `;
        }
      } catch {}
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/attendance/stats');
        const data = await res.json();
        currentStats = data;

        const badge = document.getElementById('attendanceStatusBadge');
        const revertBox = document.getElementById('revertActionBox');

        document.getElementById('countKeldi').textContent = data.keldi ? data.keldi.length : 0;
        document.getElementById('countKechikdi').textContent = data.kechikdi ? data.kechikdi.length : 0;
        document.getElementById('countSababli').textContent = data.sababli ? data.sababli.length : 0;
        document.getElementById('countKelmadi').textContent = data.kelmadi ? data.kelmadi.length : 0;

        if (data.status === 'SENT_FOR_APPROVAL') {
          badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800";
          badge.textContent = "Ustoz tasdiqlashini kutmoqda ⏳";
          revertBox.classList.remove('hidden');
        } else if (data.status === 'APPROVED') {
          badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800";
          badge.textContent = "Tasdiqlangan ✓";
          revertBox.classList.remove('hidden');
        } else if (data.status === 'DRAFT') {
          badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800";
          badge.textContent = "Qoralamada";
          revertBox.classList.remove('hidden');
        } else {
          badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600";
          badge.textContent = "Bugun davomat qilinmadi ✕";
          revertBox.classList.add('hidden');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadViolators() {
      try {
        const res = await fetch('/api/attendance/top-violators');
        const data = await res.json();
        const list = document.getElementById('violatorsList');

        if (!data || data.length === 0) {
          list.innerHTML = `<p class="text-sm text-slate-400">Oxirgi 30 kunda dars qoldirganlar mavjud emas.</p>`;
          return;
        }

        list.innerHTML = data.map((v, i) => `
          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">${i+1}</span>
              <div>
                <p class="text-sm font-bold text-slate-800">${v.student?.full_name || 'Noma`lum'}</p>
                <p class="text-xs text-slate-400">${v.student?.group_name || ''}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700">
                ${v.total_violations} ta qoldirish
              </span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function handleRevertAttendance() {
      if (!currentStats?.session_id) return alert('Davomat ID topilmadi.');
      if (!confirm('Haqiqatan ham bugungi davomatni bekor qilib, qaytadan qilasizmi?')) return;

      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'edit_draft', session_id: currentStats.session_id })
        });
        if (res.ok) {
          alert('Davomat bekor qilindi. Davomat qilish sahifasiga yo`naltirilmoqdasiz...');
          window.location.href = '/starssa/attendance.html';
        } else {
          alert('Xatolik yuz berdi');
        }
      } catch (err) {
        alert('Server xatosi: ' + err.message);
      }
    }

    init();
  </script>
</body>
</html>
