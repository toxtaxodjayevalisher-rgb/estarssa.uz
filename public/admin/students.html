<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'quvchilar Boshqaruvi — E-STARSSA (Admin)</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="layoutContainer" class="min-h-[100dvh] flex flex-col md:flex-row">
    
    <main class="flex-1 flex flex-col min-w-0 pb-20 md:pb-6 overflow-y-auto">
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">O'quvchilar Boshqaruvi</h1>
          <p class="text-xs sm:text-sm text-slate-500">Barcha guruh o'quvchilari ma'lumotlar bazasi</p>
        </div>
        <button onclick="openAddStudentModal()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-blue-500/20 transition flex items-center gap-1.5">
          <span>+</span>
          <span>O'quvchi qo'shish</span>
        </button>
      </header>

      <div class="p-4 sm:p-8 space-y-6 max-w-5xl w-full mx-auto">
        <div class="flex items-center gap-3">
          <input id="searchInput" oninput="filterStudents()" placeholder="Ism, guruh yoki telefon bo'yicha qidirish..." class="flex-1 p-2.5 rounded-xl border border-slate-200 bg-white text-sm outline-none focus:ring-2 focus:ring-blue-600" />
          <span id="studentsCountBadge" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-600 whitespace-nowrap">
            Jami: 0 ta
          </span>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div id="studentsList" class="divide-y divide-slate-100">
            <p class="p-8 text-center text-sm text-slate-400">O'quvchilar yuklanmoqda...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Student Modal -->
  <div id="studentModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="modalTitle" class="font-bold text-slate-900 text-base sm:text-lg">O'quvchi qo'shish</h3>
        <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>

      <form id="studentForm" class="space-y-3">
        <input type="hidden" id="studentId" />
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">F.I.SH *</label>
          <input id="studentFullName" required placeholder="Familiya Ism Sharif" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Guruh *</label>
          <input id="studentGroup" required placeholder="Masalan: IG2-26" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Telefon raqam</label>
          <input id="studentPhone" placeholder="+998901234567" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tug'ilgan sana</label>
          <input id="studentBirthDate" type="date" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm" />
        </div>
        <div class="flex items-center justify-end gap-2 pt-3">
          <button type="button" onclick="closeStudentModal()" class="px-4 py-2 rounded-xl text-slate-600 font-bold text-xs">Bekor qilish</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-md shadow-blue-500/20">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let students = [];

    async function init() {
      const user = await EStarssa.requireAuth(['ADMIN']);
      if (!user) return;
      EStarssa.renderLayout('/admin/students', user.role, user);

      loadStudents();
    }

    async function loadStudents() {
      try {
        const res = await fetch('/api/students');
        const data = await res.json();
        if (Array.isArray(data)) {
          students = data;
          document.getElementById('studentsCountBadge').textContent = `Jami: ${students.length} ta`;
          filterStudents();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function filterStudents() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = students.filter(s => 
        s.full_name?.toLowerCase().includes(q) || 
        s.group_name?.toLowerCase().includes(q) ||
        (s.phone && s.phone.includes(q))
      );

      const list = document.getElementById('studentsList');
      if (filtered.length === 0) {
        list.innerHTML = `<p class="p-8 text-center text-sm text-slate-400">O'quvchilar topilmadi.</p>`;
        return;
      }

      list.innerHTML = filtered.map((s, idx) => `
        <div class="p-4 sm:p-5 flex items-center justify-between hover:bg-slate-50 transition">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-blue-50 text-blue-700 font-bold text-xs flex items-center justify-center flex-shrink-0">
              ${idx + 1}
            </span>
            <div>
              <p class="font-bold text-slate-900 text-sm sm:text-base">${s.full_name}</p>
              <p class="text-xs text-slate-400">Guruh: <span class="font-bold text-slate-700">${s.group_name}</span> • 📞 ${s.phone || 'Telefon yo`q'}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="openEditStudentModal('${s.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
              Tahrirlash
            </button>
            <button onclick="deleteStudent('${s.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs">
              O'chirish
            </button>
          </div>
        </div>
      `).join('');
    }

    function openAddStudentModal() {
      document.getElementById('modalTitle').textContent = "Yangi o'quvchi qo'shish";
      document.getElementById('studentId').value = '';
      document.getElementById('studentFullName').value = '';
      document.getElementById('studentGroup').value = '';
      document.getElementById('studentPhone').value = '';
      document.getElementById('studentBirthDate').value = '';
      document.getElementById('studentModal').classList.remove('hidden');
    }

    function openEditStudentModal(id) {
      const s = students.find(x => x.id === id);
      if (!s) return;
      document.getElementById('modalTitle').textContent = "O'quvchini tahrirlash";
      document.getElementById('studentId').value = s.id;
      document.getElementById('studentFullName').value = s.full_name;
      document.getElementById('studentGroup').value = s.group_name;
      document.getElementById('studentPhone').value = s.phone || '';
      document.getElementById('studentBirthDate').value = s.birth_date ? s.birth_date.split('T')[0] : '';
      document.getElementById('studentModal').classList.remove('hidden');
    }

    function closeStudentModal() {
      document.getElementById('studentModal').classList.add('hidden');
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('studentId').value;
      const full_name = document.getElementById('studentFullName').value.trim();
      const group_name = document.getElementById('studentGroup').value.trim();
      const phone = document.getElementById('studentPhone').value.trim();
      const birth_date = document.getElementById('studentBirthDate').value;

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/students/${id}` : '/api/students';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, full_name, group_name, phone, birth_date })
        });
        if (res.ok) {
          closeStudentModal();
          loadStudents();
        } else {
          alert('Xatolik yuz berdi');
        }
      } catch (err) {
        alert(err.message);
      }
    });

    async function deleteStudent(id) {
      if (!confirm('Haqiqatan ham ushbu o`quvchini o`chirmoqchimisiz?')) return;
      try {
        const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadStudents();
        } else {
          alert('O`chirishda xatolik yuz berdi');
        }
      } catch (e) {
        alert(e.message);
      }
    }

    init();
  </script>
</body>
</html>
